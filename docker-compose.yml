services:
  swarm_robot:
    build:
      context: .
      dockerfile: swarm_docker_img/Dockerfile.tar.amd64

    image: swarm_test
    container_name: swarm_robot

    network_mode: host
    privileged: true
    ipc: host
    pid: host

    restart: unless-stopped

    environment:
      ROS_DOMAIN_ID: 0
      RMW_IMPLEMENTATION: rmw_fastrtps_cpp
      ROS_LOCALHOST_ONLY: 0
      ROBOT_IDX: 1


    volumes:
      - /dev:/dev
      - /run/udev:/run/udev:ro
      - /etc/localtime:/etc/localtime:ro

      # The image is built with `colcon build --symlink-install`, so install/ and
      # build/ symlink back into /ros2_ws/src. Mounting source over those paths
      # makes Python and launch/config edits live without rebuilding the image.
      # Entry-point, setup.py, msg or C++ changes still require a rebuild.
      - ./ros2_robomaster/src/robomaster_ros:/ros2_ws/src/robomaster_ros
      - ./ros2_swarm/src/swarm_bringup:/ros2_ws/src/swarm_bringup
      - ./ros2_swarm/src/swarm_controller:/ros2_ws/src/swarm_controller
