# Laboratory search region in the swarm_map frame, shared by bounding_box_search
# (guidance) and bounding_box_visualizer (markers) so the enforced region and the
# drawn region cannot drift apart. Nodes that do not declare these ignore them.
#
# The box is a guidance target, not a hard constraint: rebound firings are
# bounded by maximum_force, so a spacecraft arriving with enough momentum will
# travel past a wall before reversing. Overshoot during a bounce is expected
# behavior. Size the physical safe area with clearance beyond these limits.
/**:
  ros__parameters:
    x_min: 1.5
    x_max: 2.5
    y_min: -2.0
    y_max: -1.0

/**/virtual_spacecraft:
  ros__parameters:
    # Virtual vehicle properties; these need not match the RoboMaster hardware.
    mass: 5.0
    yaw_inertia: 1.0
    timer_frequency: 0.01

    # Bounds on the summed virtual input, applied once to the total so adding a
    # contributor cannot raise the authority the safe area was sized for.
    # 1.0 N / 0.2 Nm is the envelope measured in the 2026-09-09 run that tracked
    # well; doubling it put the coast speed past what the chassis can render.
    maximum_force: 1.0
    maximum_torque: 0.2

    # Stop accelerating on a stale wrench and clamp long scheduler gaps.
    odometry_timeout: 0.25
    wrench_timeout: 0.25
    maximum_time_step: 0.05

    # Wrench contributors, summed every step. Each declares its own frame:
    # "body" thrust rotates with the craft, "inertial" is fixed in swarm_map.
    # Add a term by naming it here plus a topic/frame pair; a source that stops
    # publishing simply drops out after wrench_timeout.
    wrench_sources: ["bounding_box", "avoidance"]
    wrench_sources.bounding_box.topic: "spacecraft_wrench"
    wrench_sources.bounding_box.frame: "body"
    wrench_sources.avoidance.topic: "avoidance_wrench"
    wrench_sources.avoidance.frame: "inertial"

    qos_depth: 10
    qos_reliability: "RELIABLE"
    qos_history: "KEEP_LAST"

/**/nav2_pff:
  ros__parameters:
    timer_frequency: 0.01

    # Outer-loop gains. Start low and identify the real velocity-loop bandwidth.
    position_gain: 2.0
    yaw_gain: 1.5

    # Conservative RoboMaster motion-rendering limits.
    maximum_speed: 0.4
    maximum_yaw_rate: 0.8

    # Stop the physical chassis when either input becomes stale.
    odometry_timeout: 0.25
    reference_timeout: 0.25

    qos_depth: 10
    qos_reliability: "RELIABLE"
    qos_history: "KEEP_LAST"


/**/nav2_pidff:
  ros__parameters:
    timer_frequency: 0.01

    enable_pid: true

    # Translation: PID + velocity feedforward
    position_gain: 1.5
    position_integral_gain: 0.15
    velocity_error_gain: 0.30

    # Yaw: PID + angular-rate feedforward
    yaw_gain: 1.5
    yaw_integral_gain: 0.08
    yaw_rate_error_gain: 0.25

    # Give feedback controller some recovery authority. Keep these at or below
    # velocity_smoother.max_velocity: the smoother is downstream and its limits
    # are invisible to this node's anti-windup, so the tighter cap belongs here.
    maximum_speed: 0.5
    maximum_yaw_rate: 1.0

    odometry_timeout: 0.25
    reference_timeout: 0.25

    qos_depth: 10
    qos_reliability: "RELIABLE"
    qos_history: "KEEP_LAST"


/**/bounding_box_search:
  ros__parameters:
    timer_frequency: 0.02
    reference_timeout: 0.25
    global_frame_id: "swarm_map"

    # Box geometry comes from the shared /** block above.
    # Braking runway inside each wall; must stay below half the shortest side.
    boundary_margin: 0.01

    # Finite firings. These must not exceed virtual_spacecraft.maximum_force /
    # maximum_torque, or the simulator clamps the sum and the guidance law is
    # silently solving a different problem than the one it commanded.
    boundary_force: 1.5
    rebound_speed: 0.30
    maximum_force: 2.0
    maximum_torque: 0.5

    # Thrust rises and falls as a raised cosine over initial_burn_ramp seconds
    # at each end of the burn. A step demands unbounded chassis acceleration to
    # render; the ramp is still steep enough to read as a thruster firing.
    # Clamped internally to half of initial_burn_duration.
    initial_burn_duration: 2.0
    initial_burn_ramp: 2.0
    initial_force_x: 1.0
    initial_force_y: 1.0
    initial_torque: 0.5

    # Sideways kick on each bounce, as a fraction of boundary_force, with a sign
    # drawn once per bounce. Breaks the degenerate straight-line rebound.
    # Set random_seed non-zero to replay an identical run.
    lateral_kick_fraction: 0.15
    random_seed: 0

    qos_depth: 10
    qos_reliability: "RELIABLE"
    qos_history: "KEEP_LAST"

/**/bounding_box_visualizer:
  ros__parameters:
    timer_frequency: 0.05
    source_timeout: 0.25
    global_frame_id: "swarm_map"
    triangle_size: 0.12
    # Arrow scaling only; must equal the simulator ceiling or the arrow clips.
    maximum_force: 1.0
    maximum_torque: 0.2
    force_arrow_max_length: 1.0
    torque_arrow_max_radius: 0.25
    show_physical_robot: true
    show_indoor_gps: false
    indoor_gps_timeout: 1.0
    indoor_gps_marker_size: 0.08
    show_imu_orientations: false
    imu_orientation_timeout: 0.5
    imu_arrow_length: 0.20
    mm_imu_arrow_length: 0.28
    qos_depth: 10
    qos_reliability: "RELIABLE"
    qos_history: "KEEP_LAST"

/**/nav2_dwb_path:
  ros__parameters:
    path_update_period: 0.1
    reference_timeout: 0.25
    goal_checker_id: "general_goal_checker"
    qos_depth: 10
    qos_reliability: "RELIABLE"
    qos_history: "KEEP_LAST"

/**/controller_server:
  ros__parameters:
    use_sim_time: false
    controller_frequency: 20.0
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.001
    min_theta_velocity_threshold: 0.001
    failure_tolerance: 0.0
    odom_topic: "localization/odom"
    progress_checker_plugin: "progress_checker"
    goal_checker_plugins: ["general_goal_checker"]
    controller_plugins: ["DWBStandard", "DWBVelocityFF", "DWBVelocityFeedback"]

    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      required_movement_radius: 0.02
      movement_time_allowance: 5.0

    general_goal_checker:
      plugin: "nav2_controller::SimpleGoalChecker"
      xy_goal_tolerance: 0.05
      yaw_goal_tolerance: 0.1
      stateful: false

    DWBStandard:
      plugin: "dwb_core::DWBLocalPlanner"
      trajectory_generator_name: "dwb_plugins::LimitedAccelGenerator"
      min_vel_x: -0.4
      max_vel_x: 0.4
      min_vel_y: -0.4
      max_vel_y: 0.4
      max_vel_theta: 0.8
      min_speed_xy: 0.0
      max_speed_xy: 0.4
      min_speed_theta: 0.0
      acc_lim_x: 0.3
      acc_lim_y: 0.3
      acc_lim_theta: 0.8
      decel_lim_x: -0.5
      decel_lim_y: -0.5
      decel_lim_theta: -1.2
      vx_samples: 7
      vy_samples: 7
      vtheta_samples: 9
      sim_time: 1.0
      linear_granularity: 0.05
      angular_granularity: 0.025
      transform_tolerance: 0.2
      short_circuit_trajectory_evaluation: true
      critics: ["RotateToGoal", "Oscillation", "GoalDist"]
      GoalDist.scale: 24.0
      RotateToGoal.scale: 16.0
      RotateToGoal.slowing_factor: 5.0
      RotateToGoal.lookahead_time: -1.0

    DWBVelocityFF:
      plugin: "dwb_core::DWBLocalPlanner"
      trajectory_generator_name: "dwb_plugins::LimitedAccelGenerator"
      min_vel_x: -0.4
      max_vel_x: 0.4
      min_vel_y: -0.4
      max_vel_y: 0.4
      max_vel_theta: 0.8
      min_speed_xy: 0.0
      max_speed_xy: 0.4
      min_speed_theta: 0.0
      acc_lim_x: 0.3
      acc_lim_y: 0.3
      acc_lim_theta: 0.8
      decel_lim_x: -0.5
      decel_lim_y: -0.5
      decel_lim_theta: -1.2
      vx_samples: 7
      vy_samples: 7
      vtheta_samples: 9
      sim_time: 1.0
      linear_granularity: 0.05
      angular_granularity: 0.025
      transform_tolerance: 0.2
      short_circuit_trajectory_evaluation: true
      critics: ["RotateToGoal", "Oscillation", "GoalDist", "VirtualVelocity"]
      GoalDist.scale: 24.0
      RotateToGoal.scale: 16.0
      RotateToGoal.slowing_factor: 5.0
      RotateToGoal.lookahead_time: -1.0
      VirtualVelocity.class: "swarm_dwb_critics::VirtualVelocityCritic"
      VirtualVelocity.scale: 5.0
      VirtualVelocity.reference_topic: "virtual_spacecraft/odom"
      VirtualVelocity.reference_timeout: 0.25
      VirtualVelocity.linear_feedback_gain: 0.0
      VirtualVelocity.angular_feedback_gain: 0.0
      VirtualVelocity.linear_x_weight: 1.0
      VirtualVelocity.linear_y_weight: 1.0
      VirtualVelocity.angular_weight: 1.0

    DWBVelocityFeedback:
      plugin: "dwb_core::DWBLocalPlanner"
      trajectory_generator_name: "dwb_plugins::LimitedAccelGenerator"
      min_vel_x: -0.4
      max_vel_x: 0.4
      min_vel_y: -0.4
      max_vel_y: 0.4
      max_vel_theta: 0.8
      min_speed_xy: 0.0
      max_speed_xy: 0.4
      min_speed_theta: 0.0
      acc_lim_x: 0.3
      acc_lim_y: 0.3
      acc_lim_theta: 0.8
      decel_lim_x: -0.5
      decel_lim_y: -0.5
      decel_lim_theta: -1.2
      vx_samples: 7
      vy_samples: 7
      vtheta_samples: 9
      sim_time: 1.0
      linear_granularity: 0.05
      angular_granularity: 0.025
      transform_tolerance: 0.2
      short_circuit_trajectory_evaluation: true
      critics: ["RotateToGoal", "Oscillation", "GoalDist", "VirtualVelocity"]
      GoalDist.scale: 24.0
      RotateToGoal.scale: 16.0
      RotateToGoal.slowing_factor: 5.0
      RotateToGoal.lookahead_time: -1.0
      VirtualVelocity.class: "swarm_dwb_critics::VirtualVelocityCritic"
      VirtualVelocity.scale: 5.0
      VirtualVelocity.reference_topic: "virtual_spacecraft/odom"
      VirtualVelocity.reference_timeout: 0.25
      VirtualVelocity.linear_feedback_gain: 0.3
      VirtualVelocity.angular_feedback_gain: 0.3
      VirtualVelocity.linear_x_weight: 1.0
      VirtualVelocity.linear_y_weight: 1.0
      VirtualVelocity.angular_weight: 1.0

/**/local_costmap:
  ros__parameters:
    use_sim_time: false
    update_frequency: 5.0
    publish_frequency: 2.0
    global_frame: "swarm_map"
    robot_base_frame: "<robot_namespace>/base_link"
    rolling_window: true
    width: 3.0
    height: 3.0
    resolution: 0.05
    robot_radius: 0.22
    plugins: ["inflation_layer"]
    inflation_layer:
      plugin: "nav2_costmap_2d::InflationLayer"
      cost_scaling_factor: 3.0
      inflation_radius: 0.3
    always_send_full_costmap: true

/**/velocity_smoother:
  ros__parameters:
    use_sim_time: false
    smoothing_frequency: 50.0
    scale_velocities: true
    feedback: "OPEN_LOOP"


    # Acceleration authority, not a comfort setting. The chassis must out-
    # accelerate the virtual reference (a_max = maximum_force / mass) with
    # enough left over to close position error; at 0.5 the margin over a 0.4
    # m/s^2 reference was 20% and the burn transient dominated tracking error.

    # max_velocity: [1.0, 1.0, 2.0]
    # min_velocity: [-1.0, -1.0, -2.0]
    # max_accel: [1.5, 1.5, 3.0]
    # max_decel: [-2.0, -2.0, -4.0]


    max_velocity: [0.5, 0.5, 1.0]
    min_velocity: [-0.5, -0.5, -1.0]
    max_accel: [0.5, 0.5, 0.8]
    max_decel: [-0.2, -0.2, -0.8]


    
    deadband_velocity: [0.0, 0.0, 0.0]
    velocity_timeout: 0.25
    odom_topic: "localization/odom"
    odom_duration: 0.1


    
/**/pose_publisher:
  ros__parameters:
    init_period: 2.0
    timer_frequency: 0.01
    init_orientation: 0.0

    global_frame_id: "swarm_map"

    gps_timeout: 0.25
    odometry_timeout: 0.25
    gps_position_variance: 0.01

    # --------------------------------------------------
    # Marvelmind x/y
    # --------------------------------------------------

    position_filter_enabled: true

    # One isolated bad sample is rejected.
    # At 100 Hz this costs roughly one sample of
    # response at an abrupt real position change.
    position_median_window: 3

    position_min_cutoff: 2.0
    position_beta: 2.0
    position_derivative_cutoff: 1.0

    # --------------------------------------------------
    # RoboMaster yaw and x/y
    # --------------------------------------------------

    odom_position_filter_enabled: true
    odom_position_min_cutoff: 2.0
    odom_position_beta: 2.0
    odom_position_derivative_cutoff: 1.0


    yaw_filter_enabled: true
    yaw_min_cutoff: 3.0
    yaw_beta: 1.0
    yaw_derivative_cutoff: 1.0


    # --------------------------------------------------
    # RoboMaster body velocity
    # Keep relatively responsive because PID+FF uses it.
    # --------------------------------------------------

    twist_filter_enabled: true
    twist_min_cutoff: 4.0
    twist_beta: 0.5
    twist_derivative_cutoff: 1.0

    qos_depth: 10
    qos_reliability: "RELIABLE"
    qos_history: "KEEP_LAST"