/**/local_costmap:
  ros__parameters:
    use_sim_time: false
    update_frequency: 5.0
    publish_frequency: 2.0
    global_frame: "swarm_map"
    robot_base_frame: "<robot_namespace>/base_link"
    rolling_window: true
    width: 3.0
    height: 3.0
    resolution: 0.05
    robot_radius: 0.22
    plugins: ["inflation_layer"]
    inflation_layer:
      plugin: "nav2_costmap_2d::InflationLayer"
      cost_scaling_factor: 3.0
      inflation_radius: 0.3
    always_send_full_costmap: true

/**/velocity_smoother:
  ros__parameters:
    use_sim_time: false
    smoothing_frequency: 10.0  # was 50 Hz - final cmd_vel rate to driver; robot can't react faster
    scale_velocities: true
    feedback: "OPEN_LOOP"


    # Acceleration authority, not a comfort setting. The chassis must out-
    # accelerate the virtual reference (a_max = maximum_force / mass) with
    # enough left over to close position error; at 0.5 the margin over a 0.4
    # m/s^2 reference was 20% and the burn transient dominated tracking error.

    # max_velocity: [1.0, 1.0, 2.0]
    # min_velocity: [-1.0, -1.0, -2.0]
    # max_accel: [1.5, 1.5, 3.0]
    # max_decel: [-2.0, -2.0, -4.0]


    max_velocity: [0.5, 0.5, 1.0]
    min_velocity: [-0.5, -0.5, -1.0]
    max_accel: [0.5, 0.5, 0.8]
    max_decel: [-0.5, -0.5, -0.8]


    
    deadband_velocity: [0.0, 0.0, 0.0]
    velocity_timeout: 0.25
    odom_topic: "localization/odom"
    odom_duration: 0.1


    
/**/pose_publisher:
  ros__parameters:
    init_period: 2.0
    timer_frequency: 0.1  # 10 Hz (was 100 Hz) - timer only re-publishes already-fused state; fusion runs in sensor callbacks
    init_orientation: 0.0

    global_frame_id: "swarm_map"

    gps_timeout: 0.25
    odometry_timeout: 0.25
    gps_position_variance: 0.01

    # --------------------------------------------------
    # Marvelmind x/y
    # --------------------------------------------------

    position_filter_enabled: true

    # One isolated bad sample is rejected.
    # At 100 Hz this costs roughly one sample of
    # response at an abrupt real position change.
    position_median_window: 3

    position_min_cutoff: 2.0
    position_beta: 2.0
    position_derivative_cutoff: 1.0

    # --------------------------------------------------
    # RoboMaster yaw and x/y
    # --------------------------------------------------

    odom_position_filter_enabled: true
    odom_position_min_cutoff: 2.0
    odom_position_beta: 2.0
    odom_position_derivative_cutoff: 1.0


    yaw_filter_enabled: true
    yaw_min_cutoff: 3.0
    yaw_beta: 1.0
    yaw_derivative_cutoff: 1.0


    # --------------------------------------------------
    # RoboMaster body velocity
    # Keep relatively responsive because PID+FF uses it.
    # --------------------------------------------------

    twist_filter_enabled: true
    twist_min_cutoff: 4.0
    twist_beta: 0.5
    twist_derivative_cutoff: 1.0

    qos_depth: 10
    qos_reliability: "RELIABLE"
    qos_history: "KEEP_LAST"