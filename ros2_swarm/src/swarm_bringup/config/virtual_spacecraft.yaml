# Laboratory search region in the swarm_map frame, shared by bounding_box_search
# (guidance) and bounding_box_visualizer (markers) so the enforced region and the
# drawn region cannot drift apart. Nodes that do not declare these ignore them.
#
# The box is a guidance target, not a hard constraint: rebound firings are
# bounded by maximum_force, so a spacecraft arriving with enough momentum will
# travel past a wall before reversing. Overshoot during a bounce is expected
# behavior. Size the physical safe area with clearance beyond these limits.
/**:
  ros__parameters:
    x_min: 2.5
    x_max: 3.5
    y_min: -1.5
    y_max: -0.5

/**/virtual_spacecraft:
  ros__parameters:
    # Virtual vehicle properties; these need not match the RoboMaster hardware.
    mass: 5.0
    yaw_inertia: 1.0
    timer_frequency: 0.01

    # Bounds on the virtual inputs.
    maximum_force: 1.0
    maximum_torque: 0.1

    # Stop accelerating on a stale wrench and clamp long scheduler gaps.
    odometry_timeout: 0.25
    wrench_timeout: 0.25
    maximum_time_step: 0.05
    wrench_in_body_frame: true

    qos_depth: 10
    qos_reliability: "RELIABLE"
    qos_history: "KEEP_LAST"

/**/nav2_pff:
  ros__parameters:
    timer_frequency: 0.01

    # Outer-loop gains. Start low and identify the real velocity-loop bandwidth.
    position_gain: 2.0
    yaw_gain: 1.5

    # Conservative RoboMaster motion-rendering limits.
    maximum_speed: 0.4
    maximum_yaw_rate: 0.8

    # Stop the physical chassis when either input becomes stale.
    odometry_timeout: 0.25
    reference_timeout: 0.25

    qos_depth: 10
    qos_reliability: "RELIABLE"
    qos_history: "KEEP_LAST"


/**/nav2_pidff:
  ros__parameters:
    timer_frequency: 0.01

    enable_pid: true

    # Translation: PID + velocity feedforward
    position_gain: 1.5
    position_integral_gain: 0.15
    velocity_error_gain: 0.30

    # Yaw: PID + angular-rate feedforward
    yaw_gain: 1.5
    yaw_integral_gain: 0.08
    yaw_rate_error_gain: 0.25

    # Give feedback controller some recovery authority
    maximum_speed: 0.50
    maximum_yaw_rate: 1.0

    odometry_timeout: 0.25
    reference_timeout: 0.25

    qos_depth: 10
    qos_reliability: "RELIABLE"
    qos_history: "KEEP_LAST"


/**/bounding_box_search:
  ros__parameters:
    timer_frequency: 0.02
    reference_timeout: 0.25
    global_frame_id: "swarm_map"

    # Box geometry comes from the shared /** block above.
    # Braking runway inside each wall; must stay below half the shortest side.
    boundary_margin: 0.01

    # Finite firings; limits match the virtual dynamics configuration.
    boundary_force: 1.0
    rebound_speed: 0.15
    maximum_force: 1.0
    maximum_torque: 0.2
    initial_burn_duration: 1.0
    initial_force_x: 0.8
    initial_force_y: 0.4
    initial_torque: 0.3

    # Sideways kick on each bounce, as a fraction of boundary_force, with a sign
    # drawn once per bounce. Breaks the degenerate straight-line rebound.
    # Set random_seed non-zero to replay an identical run.
    lateral_kick_fraction: 0.15
    random_seed: 0

    qos_depth: 10
    qos_reliability: "RELIABLE"
    qos_history: "KEEP_LAST"

/**/bounding_box_visualizer:
  ros__parameters:
    timer_frequency: 0.05
    source_timeout: 0.25
    global_frame_id: "swarm_map"
    triangle_size: 0.12
    maximum_force: 1.0
    maximum_torque: 0.2
    force_arrow_max_length: 1.0
    torque_arrow_max_radius: 0.25
    show_physical_robot: true

    qos_depth: 10
    qos_reliability: "RELIABLE"
    qos_history: "KEEP_LAST"

/**/nav2_dwb_path:
  ros__parameters:
    path_update_period: 0.1
    reference_timeout: 0.25
    goal_checker_id: "general_goal_checker"
    qos_depth: 10
    qos_reliability: "RELIABLE"
    qos_history: "KEEP_LAST"

/**/controller_server:
  ros__parameters:
    use_sim_time: false
    controller_frequency: 20.0
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.001
    min_theta_velocity_threshold: 0.001
    failure_tolerance: 0.0
    odom_topic: "localization/odom"
    progress_checker_plugin: "progress_checker"
    goal_checker_plugins: ["general_goal_checker"]
    controller_plugins: ["DWBStandard", "DWBVelocityFF", "DWBVelocityFeedback"]

    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      required_movement_radius: 0.02
      movement_time_allowance: 5.0

    general_goal_checker:
      plugin: "nav2_controller::SimpleGoalChecker"
      xy_goal_tolerance: 0.05
      yaw_goal_tolerance: 0.1
      stateful: false

    DWBStandard:
      plugin: "dwb_core::DWBLocalPlanner"
      trajectory_generator_name: "dwb_plugins::LimitedAccelGenerator"
      min_vel_x: -0.4
      max_vel_x: 0.4
      min_vel_y: -0.4
      max_vel_y: 0.4
      max_vel_theta: 0.8
      min_speed_xy: 0.0
      max_speed_xy: 0.4
      min_speed_theta: 0.0
      acc_lim_x: 0.3
      acc_lim_y: 0.3
      acc_lim_theta: 0.8
      decel_lim_x: -0.5
      decel_lim_y: -0.5
      decel_lim_theta: -1.2
      vx_samples: 7
      vy_samples: 7
      vtheta_samples: 9
      sim_time: 1.0
      linear_granularity: 0.05
      angular_granularity: 0.025
      transform_tolerance: 0.2
      short_circuit_trajectory_evaluation: true
      critics: ["RotateToGoal", "Oscillation", "GoalDist"]
      GoalDist.scale: 24.0
      RotateToGoal.scale: 16.0
      RotateToGoal.slowing_factor: 5.0
      RotateToGoal.lookahead_time: -1.0

    DWBVelocityFF:
      plugin: "dwb_core::DWBLocalPlanner"
      trajectory_generator_name: "dwb_plugins::LimitedAccelGenerator"
      min_vel_x: -0.4
      max_vel_x: 0.4
      min_vel_y: -0.4
      max_vel_y: 0.4
      max_vel_theta: 0.8
      min_speed_xy: 0.0
      max_speed_xy: 0.4
      min_speed_theta: 0.0
      acc_lim_x: 0.3
      acc_lim_y: 0.3
      acc_lim_theta: 0.8
      decel_lim_x: -0.5
      decel_lim_y: -0.5
      decel_lim_theta: -1.2
      vx_samples: 7
      vy_samples: 7
      vtheta_samples: 9
      sim_time: 1.0
      linear_granularity: 0.05
      angular_granularity: 0.025
      transform_tolerance: 0.2
      short_circuit_trajectory_evaluation: true
      critics: ["RotateToGoal", "Oscillation", "GoalDist", "VirtualVelocity"]
      GoalDist.scale: 24.0
      RotateToGoal.scale: 16.0
      RotateToGoal.slowing_factor: 5.0
      RotateToGoal.lookahead_time: -1.0
      VirtualVelocity.class: "swarm_dwb_critics::VirtualVelocityCritic"
      VirtualVelocity.scale: 5.0
      VirtualVelocity.reference_topic: "virtual_spacecraft/odom"
      VirtualVelocity.reference_timeout: 0.25
      VirtualVelocity.linear_feedback_gain: 0.0
      VirtualVelocity.angular_feedback_gain: 0.0
      VirtualVelocity.linear_x_weight: 1.0
      VirtualVelocity.linear_y_weight: 1.0
      VirtualVelocity.angular_weight: 1.0

    DWBVelocityFeedback:
      plugin: "dwb_core::DWBLocalPlanner"
      trajectory_generator_name: "dwb_plugins::LimitedAccelGenerator"
      min_vel_x: -0.4
      max_vel_x: 0.4
      min_vel_y: -0.4
      max_vel_y: 0.4
      max_vel_theta: 0.8
      min_speed_xy: 0.0
      max_speed_xy: 0.4
      min_speed_theta: 0.0
      acc_lim_x: 0.3
      acc_lim_y: 0.3
      acc_lim_theta: 0.8
      decel_lim_x: -0.5
      decel_lim_y: -0.5
      decel_lim_theta: -1.2
      vx_samples: 7
      vy_samples: 7
      vtheta_samples: 9
      sim_time: 1.0
      linear_granularity: 0.05
      angular_granularity: 0.025
      transform_tolerance: 0.2
      short_circuit_trajectory_evaluation: true
      critics: ["RotateToGoal", "Oscillation", "GoalDist", "VirtualVelocity"]
      GoalDist.scale: 24.0
      RotateToGoal.scale: 16.0
      RotateToGoal.slowing_factor: 5.0
      RotateToGoal.lookahead_time: -1.0
      VirtualVelocity.class: "swarm_dwb_critics::VirtualVelocityCritic"
      VirtualVelocity.scale: 5.0
      VirtualVelocity.reference_topic: "virtual_spacecraft/odom"
      VirtualVelocity.reference_timeout: 0.25
      VirtualVelocity.linear_feedback_gain: 0.3
      VirtualVelocity.angular_feedback_gain: 0.3
      VirtualVelocity.linear_x_weight: 1.0
      VirtualVelocity.linear_y_weight: 1.0
      VirtualVelocity.angular_weight: 1.0

/**/local_costmap:
  ros__parameters:
    use_sim_time: false
    update_frequency: 5.0
    publish_frequency: 2.0
    global_frame: "swarm_map"
    robot_base_frame: "<robot_namespace>/base_link"
    rolling_window: true
    width: 3.0
    height: 3.0
    resolution: 0.05
    robot_radius: 0.22
    plugins: ["inflation_layer"]
    inflation_layer:
      plugin: "nav2_costmap_2d::InflationLayer"
      cost_scaling_factor: 3.0
      inflation_radius: 0.3
    always_send_full_costmap: true

/**/velocity_smoother:
  ros__parameters:
    use_sim_time: false
    smoothing_frequency: 50.0
    scale_velocities: true
    feedback: "OPEN_LOOP"
    max_velocity: [0.5, 0.5, 1.0]
    min_velocity: [-0.5, -0.5, -1.0]
    max_accel: [0.5, 0.5, 1.2]
    max_decel: [-0.7, -0.7, -1.5]
    deadband_velocity: [0.0, 0.0, 0.0]
    velocity_timeout: 0.25
    odom_topic: "localization/odom"
    odom_duration: 0.1


    
