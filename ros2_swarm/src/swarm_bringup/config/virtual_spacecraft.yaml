# Laboratory search region in the swarm_map frame, shared by bounding_box_search
# (guidance) and bounding_box_visualizer (markers) so the enforced region and the
# drawn region cannot drift apart. Nodes that do not declare these ignore them.
#
# The box is a guidance target, not a hard constraint: rebound firings are
# bounded by maximum_force, so a spacecraft arriving with enough momentum will
# travel past a wall before reversing. Overshoot during a bounce is expected
# behavior. Size the physical safe area with clearance beyond these limits.
/**:
  # ros__parameters:
  #   x_min: 1.5
  #   x_max: 2.5
  #   y_min: -2.0
  #   y_max: -1.0

  # Walls (≈ beacon extents): west ~x=-5.61, east ~x=+0.36, north ~y=0.0,
  # south ~y=-5.02. Box pulled in to leave ~1 m overshoot clearance every side;
  # the previous x_max: 0.0 sat right on the east wall (beacon 13) → collisions.
  ros__parameters:
    x_min: -4.5
    x_max: -1.0
    y_min: -4.0
    y_max: -1.0

/**/virtual_spacecraft:
  ros__parameters:
    # Virtual vehicle properties; these need not match the RoboMaster hardware.
    mass: 5.0
    yaw_inertia: 0.25
    timer_frequency: 0.02  # 50 Hz (was 100 Hz) - dt is measured from the clock, gains unaffected

    # Bounds on the summed virtual input, applied once to the total so adding a
    # contributor cannot raise the authority the safe area was sized for.
    # 1.0 N / 0.2 Nm is the envelope measured in the 2026-09-09 run that tracked
    # well; doubling it put the coast speed past what the chassis can render.
    maximum_force: 1.0
    maximum_torque: 0.2

    # Bounds on the virtual *state*, not the input. maximum_force alone does not
    # bound velocity: this is an undamped double integrator, so a bounded force
    # applied long enough reaches any speed. Measured 2026-10-07 on RM2, the
    # reference was coasting at 0.461 m/s while nav2_pidff.maximum_speed is
    # 0.5 -- 8% of authority left to close a 1.26 m error, so the error could
    # not converge.
    #
    # Held at half the tracker's limits (0.5 m/s, 1.0 rad/s), leaving 2x the
    # reference speed as catch-up authority. Raise only together with the
    # nav2_pidff limits, and never above them.
    maximum_speed: 0.25
    maximum_yaw_rate: 0.5

    # Planar Clohessy-Wiltshire relative dynamics, added on top of the clamped
    # wrench because orbital mechanics is environment and must not consume
    # control authority. The LVLH origin is swarm_map (0, 0) with x radial and
    # y along-track, so the state is read as an LVLH offset with no transform.
    # At 400 km the mean motion is ~1.1e-3 rad/s, so the force is ~1e-5 N at a
    # 2 m offset: present and correct, but invisible next to maximum_force.
    enable_chw: true
    orbit_altitude: 400000.0
    gravity: 9.80665
    earth_radius: 6371000.0

    # odometry_timeout now gates integration, not just arming: past it the
    # reference freezes in place instead of coasting on. nav2_pidff stops the
    # chassis on the same staleness, so a reference that kept integrating
    # would walk away from a robot nobody is commanding -- measured 2026-10-07,
    # RM6 lost localization for 14.2 s and the runaway peaked at 3.95 m of
    # tracking error against a 0.072 m median while the stream was healthy.
    #
    # MUST stay <= nav2_pidff.odometry_timeout (0.3), so the reference freezes
    # no later than the tracker stops. Raising this one alone reopens the gap.
    odometry_timeout: 0.25
    wrench_timeout: 0.25
    maximum_time_step: 0.05

    # Wrench contributors, summed every step. Each declares its own frame:
    # "body" thrust rotates with the craft, "inertial" is fixed in swarm_map.
    # Add a term by naming it here plus a topic/frame pair; a source that stops
    # publishing simply drops out after wrench_timeout.
    # Four contributors, one per behaviour layer. All are summed every step and
    # the SUM is clamped to maximum_force / maximum_torque, so each layer may
    # saturate its own publisher-side cap without the total ever exceeding the
    # validated envelope. The mode_supervisor does not route or mux these: it
    # only enables/disables the guidance nodes that publish flocking/capture, and
    # a disabled layer publishes an explicit zero Wrench so it drops to 0 N in
    # the sum (and, after wrench_timeout, drops out entirely if it stops).
    #   bounding_box  SEARCH-phase box-keeping burn      (body, always on)
    #   flocking      ENCAPSULATION landmark APF         (inertial, gated)
    #   capture       CAPTURE approach/align velocity    (body, gated)
    #   avoidance     inter-robot anti-flocking          (inertial, always on)
    #   pointing      heading-hold torque                (inertial, always on)
    wrench_sources: ["bounding_box", "flocking", "capture", "avoidance", "pointing"]
    wrench_sources.bounding_box.topic: "spacecraft_wrench"
    wrench_sources.bounding_box.frame: "body"
    wrench_sources.flocking.topic: "flocking_wrench"
    wrench_sources.flocking.frame: "inertial"
    wrench_sources.capture.topic: "capture_wrench"
    wrench_sources.capture.frame: "body"
    wrench_sources.avoidance.topic: "avoidance_wrench"
    wrench_sources.avoidance.frame: "inertial"
    wrench_sources.pointing.topic: "pointing_wrench"
    wrench_sources.pointing.frame: "inertial"

    qos_depth: 10
    qos_reliability: "RELIABLE"
    qos_history: "KEEP_LAST"

/**/nav2_pff:
  ros__parameters:
    timer_frequency: 0.01

    # Outer-loop gains. Start low and identify the real velocity-loop bandwidth.
    position_gain: 1.0
    yaw_gain: 0.5

    # Conservative RoboMaster motion-rendering limits.
    maximum_speed: 0.4
    maximum_yaw_rate: 0.8

    # Stop the physical chassis when either input becomes stale.
    odometry_timeout: 0.25
    reference_timeout: 0.25

    qos_depth: 10
    qos_reliability: "RELIABLE"
    qos_history: "KEEP_LAST"


/**/nav2_pidff:
  ros__parameters:
    # 20 Hz (was 5 Hz). The old comment justified 5 Hz with "robot can't react
    # faster", which is true of the chassis but not of this loop: the rate also
    # sets how long a spurious stop lasts. update() publishes a zero Twist
    # whenever an input is older than odometry_timeout, so at 5 Hz every such
    # misfire cost a full 200 ms of standstill. Measured 2026-10-07 on RM2:
    # 24 gaps >0.25 s in 25 s on localization/odom, i.e. roughly one stop per
    # second, against a virtual reference coasting at 0.46 m/s.
    #
    # 0.2 s period against a 0.25 s timeout also left only 50 ms of margin --
    # the loop was barely faster than its own staleness gate. At 0.05 s the
    # timeout is 5 control periods away.
    #
    # dt is measured from the clock, so the gains are unaffected by this change.
    timer_frequency: 0.05

    enable_pid: true

    # Translation: PID + velocity feedforward
    position_gain: 1.5
    position_integral_gain: 0.15
    velocity_error_gain: 0.30

    # Yaw: PID + angular-rate feedforward
    yaw_gain: 1.5
    yaw_integral_gain: 0.08
    yaw_rate_error_gain: 0.25

    # Give feedback controller some recovery authority. Keep these at or below
    # velocity_smoother.max_velocity: the smoother is downstream and its limits
    # are invisible to this node's anti-windup, so the tighter cap belongs here.
    maximum_speed: 0.5
    maximum_yaw_rate: 1.0

    # 0.3 (was 0.25). update() publishes a zero Twist and wipes the integral
    # whenever either input is older than this, so the value is not a safety
    # margin -- it is the length of input dropout the controller rides through.
    # Measured 2026-10-07 on RM2: 24 breaches in 25 s on localization/odom,
    # worst gap 0.936 s, which is roughly one spurious stop per second.
    #
    # The cost of looser gating is acting on a stale pose, and that cost fell
    # sharply once virtual_spacecraft.maximum_speed capped the reference at
    # 0.25 m/s: 0.3 s of staleness is now 0.075 m of reference travel, against
    # 0.28 m at the old uncapped 0.46 m/s coast. That is what makes 0.3
    # affordable; it would not have been before the cap.
    #
    # Deliberately conservative. The gap distribution is unknown, so this may
    # only catch the shortest of the 24 breaches -- measure the percentiles
    # before reaching for a larger number.
    odometry_timeout: 0.3
    reference_timeout: 0.3

    qos_depth: 10
    qos_reliability: "RELIABLE"
    qos_history: "KEEP_LAST"


/**/bounding_box_search:
  ros__parameters:
    timer_frequency: 0.1  # 10 Hz (was 50 Hz) - callback is time/position driven, not rate driven; consumer holds last wrench between updates
    reference_timeout: 0.25
    global_frame_id: "swarm_map"

    # Box geometry comes from the shared /** block above.
    # Braking runway inside each wall; must stay below half the shortest side.
    # Was 0.01 m (≈no runway → max overshoot). 0.4 m starts the reverse burn
    # well before the boundary. Shortest side is 3.0 m, so half is 1.5 m > 0.4.
    boundary_margin: 0.4

    # Finite firings. These must not exceed virtual_spacecraft.maximum_force /
    # maximum_torque, or the simulator clamps the sum and the guidance law is
    # silently solving a different problem than the one it commanded.
    # Brought at/under the 1.0 N / 0.2 Nm envelope so commanded == rendered
    # (were 1.5 / 2.0 / 0.5 → clamped, so braking was weaker than the law assumed).
    #
    # Halved from 1.0 once avoidance_wrench became a second contributor. The
    # simulator scales the *resultant* down to virtual_spacecraft.maximum_force
    # (1.0 N), so two contributors capped at 1.0 each cancel to ~0 N when they
    # oppose -- avoidance could never win, only tie, and the craft would coast
    # into the neighbour. At 0.5 the box force yields 0.5 N of net authority to a
    # saturated avoidance push while the total stays inside the validated
    # envelope. boundary_force and initial_force_* come down with it: capping
    # maximum_force alone would clamp them internally, which is the exact
    # commanded-vs-rendered mismatch this block warns about.
    boundary_force: 0.5
    rebound_speed: 0.30
    maximum_force: 0.5
    maximum_torque: 0.2

    # Thrust rises and falls as a raised cosine over initial_burn_ramp seconds
    # at each end of the burn. A step demands unbounded chassis acceleration to
    # render; the ramp is still steep enough to read as a thruster firing.
    # Clamped internally to half of initial_burn_duration.
    initial_burn_duration: 2.0
    initial_burn_ramp: 2.0
    # 0.35/0.35 → resultant 0.49 N ≤ the 0.5 maximum_force above (was 0.7/0.7 →
    # 0.99, which fit the old 1.0 cap but would now be clamped).
    initial_force_x: 0 # 0.35
    initial_force_y: 0 # 0.35
    initial_torque: 0 # 0.2

    # Sideways kick on each bounce, as a fraction of boundary_force, with a sign
    # drawn once per bounce. Breaks the degenerate straight-line rebound.
    # Set random_seed non-zero to replay an identical run.
    lateral_kick_fraction: 0.15
    random_seed: 0

    qos_depth: 10
    qos_reliability: "RELIABLE"
    qos_history: "KEEP_LAST"

/**/spacecraft_visualizer:
  ros__parameters:
    timer_frequency: 0.05
    source_timeout: 0.25
    global_frame_id: "swarm_map"
    triangle_size: 0.12
    # Arrow scaling only; must equal the simulator ceiling or the arrow clips.
    maximum_force: 1.0
    maximum_torque: 0.2
    force_arrow_max_length: 1.0
    torque_arrow_max_radius: 0.25
    show_physical_robot: true
    show_indoor_gps: false
    indoor_gps_timeout: 1.0
    indoor_gps_marker_size: 0.08
    show_imu_orientations: false
    imu_orientation_timeout: 0.5
    imu_arrow_length: 0.20
    mm_imu_arrow_length: 0.28
    # Perception overlays: landmarks / targets (+ their normals). Markers arrive
    # body-frame in centimetres and are lifted to the global frame with the
    # physical robot's own odometry pose, so they only draw while it is fresh.
    show_landmarks: true
    show_targets: true
    show_marker_normals: true
    perception_timeout: 0.5
    marker_point_size: 0.10
    normal_arrow_length: 0.20
    qos_depth: 10
    qos_reliability: "RELIABLE"
    qos_history: "KEEP_LAST"

/**/nav2_dwb_path:
  ros__parameters:
    path_update_period: 0.1
    reference_timeout: 0.25
    goal_checker_id: "general_goal_checker"
    qos_depth: 10
    qos_reliability: "RELIABLE"
    qos_history: "KEEP_LAST"

/**/controller_server:
  ros__parameters:
    use_sim_time: false
    controller_frequency: 20.0
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.001
    min_theta_velocity_threshold: 0.001
    failure_tolerance: 0.0
    odom_topic: "localization/odom"
    progress_checker_plugin: "progress_checker"
    goal_checker_plugins: ["general_goal_checker"]
    controller_plugins: ["DWBStandard", "DWBVelocityFF", "DWBVelocityFeedback"]

    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      required_movement_radius: 0.02
      movement_time_allowance: 5.0

    general_goal_checker:
      plugin: "nav2_controller::SimpleGoalChecker"
      xy_goal_tolerance: 0.05
      yaw_goal_tolerance: 0.1
      stateful: false

    DWBStandard:
      plugin: "dwb_core::DWBLocalPlanner"
      trajectory_generator_name: "dwb_plugins::LimitedAccelGenerator"
      min_vel_x: -0.4
      max_vel_x: 0.4
      min_vel_y: -0.4
      max_vel_y: 0.4
      max_vel_theta: 0.8
      min_speed_xy: 0.0
      max_speed_xy: 0.4
      min_speed_theta: 0.0
      acc_lim_x: 0.3
      acc_lim_y: 0.3
      acc_lim_theta: 0.8
      decel_lim_x: -0.5
      decel_lim_y: -0.5
      decel_lim_theta: -1.2
      vx_samples: 7
      vy_samples: 7
      vtheta_samples: 9
      sim_time: 1.0
      linear_granularity: 0.05
      angular_granularity: 0.025
      transform_tolerance: 0.2
      short_circuit_trajectory_evaluation: true
      critics: ["RotateToGoal", "Oscillation", "GoalDist"]
      GoalDist.scale: 24.0
      RotateToGoal.scale: 16.0
      RotateToGoal.slowing_factor: 5.0
      RotateToGoal.lookahead_time: -1.0

    DWBVelocityFF:
      plugin: "dwb_core::DWBLocalPlanner"
      trajectory_generator_name: "dwb_plugins::LimitedAccelGenerator"
      min_vel_x: -0.4
      max_vel_x: 0.4
      min_vel_y: -0.4
      max_vel_y: 0.4
      max_vel_theta: 0.8
      min_speed_xy: 0.0
      max_speed_xy: 0.4
      min_speed_theta: 0.0
      acc_lim_x: 0.3
      acc_lim_y: 0.3
      acc_lim_theta: 0.8
      decel_lim_x: -0.5
      decel_lim_y: -0.5
      decel_lim_theta: -1.2
      vx_samples: 7
      vy_samples: 7
      vtheta_samples: 9
      sim_time: 1.0
      linear_granularity: 0.05
      angular_granularity: 0.025
      transform_tolerance: 0.2
      short_circuit_trajectory_evaluation: true
      critics: ["RotateToGoal", "Oscillation", "GoalDist", "VirtualVelocity"]
      GoalDist.scale: 24.0
      RotateToGoal.scale: 16.0
      RotateToGoal.slowing_factor: 5.0
      RotateToGoal.lookahead_time: -1.0
      VirtualVelocity.class: "swarm_dwb_critics::VirtualVelocityCritic"
      VirtualVelocity.scale: 5.0
      VirtualVelocity.reference_topic: "virtual_spacecraft/odom"
      VirtualVelocity.reference_timeout: 0.25
      VirtualVelocity.linear_feedback_gain: 0.0
      VirtualVelocity.angular_feedback_gain: 0.0
      VirtualVelocity.linear_x_weight: 1.0
      VirtualVelocity.linear_y_weight: 1.0
      VirtualVelocity.angular_weight: 1.0

    DWBVelocityFeedback:
      plugin: "dwb_core::DWBLocalPlanner"
      trajectory_generator_name: "dwb_plugins::LimitedAccelGenerator"
      min_vel_x: -0.4
      max_vel_x: 0.4
      min_vel_y: -0.4
      max_vel_y: 0.4
      max_vel_theta: 0.8
      min_speed_xy: 0.0
      max_speed_xy: 0.4
      min_speed_theta: 0.0
      acc_lim_x: 0.3
      acc_lim_y: 0.3
      acc_lim_theta: 0.8
      decel_lim_x: -0.5
      decel_lim_y: -0.5
      decel_lim_theta: -1.2
      vx_samples: 7
      vy_samples: 7
      vtheta_samples: 9
      sim_time: 1.0
      linear_granularity: 0.05
      angular_granularity: 0.025
      transform_tolerance: 0.2
      short_circuit_trajectory_evaluation: true
      critics: ["RotateToGoal", "Oscillation", "GoalDist", "VirtualVelocity"]
      GoalDist.scale: 24.0
      RotateToGoal.scale: 16.0
      RotateToGoal.slowing_factor: 5.0
      RotateToGoal.lookahead_time: -1.0
      VirtualVelocity.class: "swarm_dwb_critics::VirtualVelocityCritic"
      VirtualVelocity.scale: 5.0
      VirtualVelocity.reference_topic: "virtual_spacecraft/odom"
      VirtualVelocity.reference_timeout: 0.25
      VirtualVelocity.linear_feedback_gain: 0.3
      VirtualVelocity.angular_feedback_gain: 0.3
      VirtualVelocity.linear_x_weight: 1.0
      VirtualVelocity.linear_y_weight: 1.0
