- name: Validate fleet image
  hosts: robots
  gather_facts: false

  vars_files:
    - vars.yml

  tasks:
    - name: Get container info
      community.docker.docker_container_info:
        name: "{{ inventory_hostname }}"
      register: container_info

    - name: Assert correct image is running
      ansible.builtin.assert:
        that:
          - container_info.container.Config.Image == swarm_image
        fail_msg: >
          {{ inventory_hostname }}: expected {{ swarm_image }},
          got {{ container_info.container.Config.Image }}
        success_msg: >
          {{ inventory_hostname }} confirmed running {{ swarm_image }}
