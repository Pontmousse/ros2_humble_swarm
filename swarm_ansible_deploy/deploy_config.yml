---
- name: Deploy RoboMaster runtime configuration
  hosts: robots
  become: yes
  gather_facts: false

  vars_files:
    - vars.yml

  tasks:

    - name: Load runtime configuration
      ansible.builtin.include_tasks: tasks/runtime_config.yml

    - name: Copy configuration files
      ansible.builtin.include_tasks: tasks/copy_config.yml

    - name: Recreate container
      ansible.builtin.include_tasks: tasks/container.yml

    - name: Validate deployment
      ansible.builtin.include_tasks: tasks/validate.yml
