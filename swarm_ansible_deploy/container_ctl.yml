---
# Stop / start / restart the existing swarm container as-is (no config copy, no
# recreate). Usage: -e cmd=stop|start|restart (default restart).
# Use deploy-config.yml after editing swarm_config.yaml / vars.yml.
- name: Control RoboMaster Swarm Node
  hosts: robots
  become: yes
  gather_facts: false
  strategy: free
  vars_files:
    - vars.yml
  vars:
    cmd: restart

  tasks:
    - ansible.builtin.assert:
        that: cmd in ['stop', 'start', 'restart']
        fail_msg: "cmd must be stop, start or restart (got '{{ cmd }}')"

    # driver_stack=v2 also controls "<host>-drivers": stopped after ours, started before it.
    - name: "{{ cmd | capitalize }} containers"
      community.docker.docker_container:
        name: "{{ item }}"
        state: "{{ 'stopped' if cmd == 'stop' else 'started' }}"
        restart: "{{ cmd == 'restart' }}"
      loop: "{{ names if cmd == 'stop' else names | reverse | list }}"
      vars:
        names: "{{ [inventory_hostname] + ([inventory_hostname ~ '-drivers'] if driver_stack == 'v2' else []) }}"


# command to stop: ansible-playbook -i swarm_ansible_deploy/inventory.ini swarm_ansible_deploy/container_ctl.yml -e cmd=stop
# command to start: ansible-playbook -i swarm_ansible_deploy/inventory.ini swarm_ansible_deploy/container_ctl.yml -e cmd=start
# command to restart: ansible-playbook -i swarm_ansible_deploy/inventory.ini swarm_ansible_deploy/container_ctl.yml -e cmd=restart