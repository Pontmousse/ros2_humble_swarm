---
- name: Deploy RoboMaster Swarm Node
  hosts: robots
  become: yes
  strategy: free

  vars_files:
    - vars.yml

  tasks:

    - name: Load runtime configuration
      ansible.builtin.include_tasks: tasks/runtime_config.yml

    - name: Deploy configuration
      ansible.builtin.include_tasks: tasks/copy_config.yml

    - name: Pull swarm image
      community.docker.docker_image:
        name: "{{ swarm_image }}"
        source: pull

    # Before our container: its image prune would delete a pulled but not yet used drivers image.
    - name: Deploy or remove drivers container
      ansible.builtin.include_tasks: tasks/drivers_container.yml

    - name: Deploy container
      ansible.builtin.include_tasks: tasks/container.yml

    - name: Validate deployment
      ansible.builtin.include_tasks: tasks/validate.yml
