swarm_image: "elghaliasri/ros2-humble-swarm:robot-arm64-v9.5.3"
swarm_image_repo: "elghaliasri/ros2-humble-swarm"

# Container names used by older revisions of this playbook. Removed on deploy so
# they cannot run a second ROS stack alongside "{{ inventory_hostname }}".
legacy_container_names:
  - swarm

remote_config_dir: /opt/robomaster/config
container_config_dir: /ros2_ws/src/swarm_bringup/config

swarm_config_src: "{{ playbook_dir }}/../ros2_swarm/src/swarm_bringup/config/swarm_config.yaml"
virtual_spacecraft_config_src: "{{ playbook_dir }}/../ros2_swarm/src/swarm_bringup/config/virtual_spacecraft.yaml"
# Bind-mounted over the image's copy so launch-param changes deploy with
# deploy-config.yml, no image rebuild. Must stay compatible with the image's nodes.
launch_file_src: "{{ playbook_dir }}/../ros2_swarm/src/swarm_bringup/launch/launch_decentralized_agent.py"
virtual_spacecraft_launch_src: "{{ playbook_dir }}/../ros2_swarm/src/swarm_bringup/launch/launch_virtual_spacecraft.py"
container_launch_dir: /ros2_ws/src/swarm_bringup/launch
# Launch file init.sh runs; -e launch_file=launch_contact_switch.py = Pi runs only the
# limit switch (centralized run from the dev PC). Needs an image that ships that file.
launch_file: "launch_decentralized_agent.py"

# COM -> GND, NO -> GPIO; per-robot override: contact_gpio in swarm_config.yaml. GND => PIN 30 | GPIO 5 => PIN 29
contact_gpio: "5"

ros_domain_id: "0"
rmw_implementation: "rmw_fastrtps_cpp"
ros_localhost_only: "0"
virtual_spacecraft: "true"
direct_cmd_vel: "false"

guidance_viz: "false"   # no RViz markers on the Pi; run launch_dev_viz.py on the dev PC
# Per-process thread pools (OpenBLAS/OpenMP/OpenCV) in both containers; the math is
# 2x2..4x4 matrices and one 640x480 detectMarkers, so 1 thread each.
lib_threads: "1"

# Chassis link to the RoboMaster body (drivers swarm_config.yaml + robomaster_link.yml usb0 unit).
conn_type: "rndis"

# Drivers: the swarm_rover_v2 image runs as a second container "<host>-drivers" (chassis, GNSS,
# USB camera + ArUco); our container's perception node reads its gnss/position and aruco/*.
# Pinned tag (public on Docker Hub); the git history of this line is the driver version history.
drivers_image: "hostage03/robomaster_swarm_v2:app-4be73e1-drivers"
drivers_nodes: "chassis,gnss,aruco_camera_2in1,health"   # robot.launch.py keys; no spacecraft (ours runs control)
drivers_config_src: "{{ playbook_dir }}/drivers_config"
remote_drivers_config_dir: /opt/robomaster/drivers_config
drivers_container_config_dir: /root/ws/config
