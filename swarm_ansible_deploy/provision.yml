---
- name: Provision RoboMaster system
  hosts: robots
  become: yes

  vars_files:
    - vars.yml

  tasks:

    - name: Configure the RoboMaster USB link
      ansible.builtin.include_tasks: tasks/robomaster_link.yml

    - name: Prepare robot system
      ansible.builtin.include_tasks: tasks/system_setup.yml
